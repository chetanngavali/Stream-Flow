<!-- StreamFlow Header Component -->
<header class="sf-header" id="sfHeader">
  <div class="sf-container">
    <div class="sf-header-inner">
      <!-- Logo -->
      <a href="javascript:void(0)" onclick="Router.navigate('home')" class="sf-logo">
        <div class="sf-logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <span class="sf-logo-text">Stream<span>Flow</span></span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="sf-nav" id="sfNav">
        <a href="javascript:void(0)" onclick="Router.navigate('home')" class="sf-nav-link" data-route="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="javascript:void(0)" onclick="Router.navigate('browse')" class="sf-nav-link" data-route="browse">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
          Live TV
        </a>
        <a href="javascript:void(0)" onclick="Router.navigate('countries')" class="sf-nav-link" data-route="countries">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          Countries
        </a>
        <a href="javascript:void(0)" onclick="Router.navigate('categories')" class="sf-nav-link" data-route="categories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Categories
        </a>
        <a href="javascript:void(0)" onclick="Router.navigate('favorites')" class="sf-nav-link" data-route="favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          Favorites
        </a>
        <a href="javascript:void(0)" onclick="Router.navigate('history')" class="sf-nav-link" data-route="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          History
        </a>
      </nav>

      <!-- Right Header Actions -->
      <div class="sf-header-actions">
        <!-- Search Trigger -->
        <div class="sf-search-trigger" onclick="Router.navigate('search')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Search...</span>
          <span class="sf-search-shortcut">/</span>
        </div>

        <!-- User Authentication & Account Button -->
        <button class="sf-btn sf-btn-primary sf-btn-sm" id="btnHeaderUserAuth" onclick="handleUserAuthBtnClick()" style="padding: 7px 14px; font-size: 0.82rem; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="headerUserAuthLabel">Sign In</span>
        </button>

        <!-- Dedicated Administrator Button -->
        <button class="sf-btn sf-btn-outline sf-btn-sm" id="btnHeaderAdmin" onclick="handleAdminBtnClick()" title="Administrator Panel" style="padding: 7px 14px; font-size: 0.82rem; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span id="headerAdminLabel">Admin</span>
          <span class="sf-admin-badge" id="headerAdminBadge" style="display: none; background: #10B981; margin-left: 2px;">Active</span>
        </button>

        <!-- Admin Logout Button -->
        <button class="sf-btn sf-btn-secondary sf-btn-sm" id="headerLogoutBtn" style="display: none; padding: 7px 12px; font-size: 0.8rem;" onclick="handleAdminLogout()">
          Logout
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Mobile Bottom Navigation -->
<div class="sf-bottom-nav">
  <div class="sf-bottom-nav-item" onclick="Router.navigate('home')" data-bottom="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </div>
  <div class="sf-bottom-nav-item" onclick="Router.navigate('browse')" data-bottom="browse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
    <span>Live TV</span>
  </div>
  <div class="sf-bottom-nav-item" onclick="Router.navigate('search')" data-bottom="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <span>Search</span>
  </div>
  <div class="sf-bottom-nav-item" onclick="Router.navigate('favorites')" data-bottom="favorites">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    <span>Favorites</span>
  </div>
  <div class="sf-bottom-nav-item" onclick="handleUserAuthBtnClick()" id="bottomNavUser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span id="bottomNavUserLabel">Account</span>
  </div>
  <div class="sf-bottom-nav-item" onclick="handleAdminBtnClick()" id="bottomNavAdmin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>Admin</span>
  </div>
</div>
