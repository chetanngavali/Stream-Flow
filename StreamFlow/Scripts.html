<script>
/**
 * StreamFlow — Client-side Application Controller
 * Handles Promises-based API client, client routing, HLS video player,
 * state persistence (Favorites, History), and UI reactivity.
 */

// Global Application State Store
const AppState = {
  channels: [],
  categories: [],
  countries: [],
  languages: [],
  settings: {},
  isAdmin: false,
  adminData: null,
  currentView: 'home',
  currentChannel: null,
  browseFilters: {
    category: 'all',
    country: '',
    language: '',
    sort: 'featured',
    page: 1,
    limit: 24
  },
  searchQuery: '',
  m3uParsedItems: []
};

/* ==========================================================================
   0. AUTHENTICATION & SESSION TOKEN STORE
   ========================================================================== */
const AuthStore = {
  TOKEN_KEY: 'sf_admin_token',
  EMAIL_KEY: 'sf_admin_email',
  getToken: function() {
    return localStorage.getItem(this.TOKEN_KEY) || sessionStorage.getItem(this.TOKEN_KEY) || '';
  },
  getEmail: function() {
    return localStorage.getItem(this.EMAIL_KEY) || sessionStorage.getItem(this.EMAIL_KEY) || '';
  },
  setToken: function(token, email) {
    localStorage.setItem(this.TOKEN_KEY, token);
    localStorage.setItem(this.EMAIL_KEY, email);
    AppState.isAdmin = true;
    updateAdminNavUI(true, email);
  },
  clearToken: function() {
    localStorage.removeItem(this.TOKEN_KEY);
    localStorage.removeItem(this.EMAIL_KEY);
    sessionStorage.removeItem(this.TOKEN_KEY);
    sessionStorage.removeItem(this.EMAIL_KEY);
    AppState.isAdmin = false;
    updateAdminNavUI(false);
  },
  isLoggedIn: function() {
    return Boolean(this.getToken());
  }
};

const UserAuthStore = {
  TOKEN_KEY: 'sf_user_token',
  PROFILE_KEY: 'sf_user_profile',
  getToken: function() {
    return localStorage.getItem(this.TOKEN_KEY) || '';
  },
  getUser: function() {
    try {
      const raw = localStorage.getItem(this.PROFILE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  },
  setUser: function(user, token) {
    localStorage.setItem(this.TOKEN_KEY, token);
    localStorage.setItem(this.PROFILE_KEY, JSON.stringify(user));
    updateUserNavUI();
  },
  clear: function() {
    localStorage.removeItem(this.TOKEN_KEY);
    localStorage.removeItem(this.PROFILE_KEY);
    updateUserNavUI();
  },
  isLoggedIn: function() {
    return Boolean(this.getToken() && this.getUser());
  }
};

function updateUserNavUI() {
  const userBtnLabel = document.getElementById('headerUserAuthLabel');
  const bottomUserLabel = document.getElementById('bottomNavUserLabel');
  const isUserLogged = UserAuthStore.isLoggedIn();
  const user = UserAuthStore.getUser();

  if (userBtnLabel) {
    if (isUserLogged && user) {
      userBtnLabel.textContent = user.name ? user.name.split(' ')[0] : 'Account';
    } else {
      userBtnLabel.textContent = 'Sign In';
    }
  }

  if (bottomUserLabel) {
    bottomUserLabel.textContent = isUserLogged ? 'Account' : 'Sign In';
  }

  if (isUserLogged && user) {
    const profileName = document.getElementById('userProfileName');
    const profileEmail = document.getElementById('userProfileEmail');
    const avatarLetter = document.getElementById('userProfileAvatarLetter');
    if (profileName) profileName.textContent = user.name || 'Member';
    if (profileEmail) profileEmail.textContent = user.email || '';
    if (avatarLetter) avatarLetter.textContent = (user.name || user.email || 'U').charAt(0).toUpperCase();
  }
}

function updateAdminNavUI(isLoggedIn, email = '') {
  const badge = document.getElementById('headerAdminBadge');
  const logoutBtn = document.getElementById('headerLogoutBtn');

  if (badge) {
    badge.style.display = isLoggedIn ? 'inline-block' : 'none';
  }
  if (logoutBtn) {
    logoutBtn.style.display = isLoggedIn ? 'inline-flex' : 'none';
  }
  const emailBadge = document.getElementById('adminUserEmailBadge');
  if (emailBadge && email) {
    emailBadge.textContent = email;
  }
}

/* ==========================================================================
   1. PROMISE-BASED APPS SCRIPT API CLIENT
   ========================================================================== */
const API = {
  call: function(fnName, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(result => resolve(result))
          .withFailureHandler(err => {
            console.error(`Apps Script API Error [${fnName}]:`, err);
            reject(err);
          })[fnName](...args);
      } else {
        console.warn(`[Local Dev] google.script.run not found. Simulating call to ${fnName}`);
        resolve(this._simulateLocal(fnName, ...args));
      }
    });
  },

  // Public Endpoints
  getChannels: () => API.call('getChannels'),
  getChannelById: (id) => API.call('getChannelById', id),
  searchChannels: (q) => API.call('searchChannels', q),
  getFeaturedChannels: () => API.call('getFeaturedChannels'),
  getCountries: () => API.call('getCountries'),
  getCategories: () => API.call('getCategories'),
  getLanguages: () => API.call('getLanguages'),
  getSettings: () => API.call('getSettings'),
  isAdmin: () => API.call('isAdmin', AuthStore.getToken()),

  // User Account & Password Reset Endpoints
  registerUser: (name, email, pass) => API.call('registerUser', name, email, pass),
  loginUser: (email, pass) => API.call('loginUser', email, pass),
  sendPasswordResetEmail: (email) => API.call('sendPasswordResetEmail', email),
  resetPasswordWithToken: (token, newPass) => API.call('resetPasswordWithToken', token, newPass),
  getUserProfile: (token) => API.call('getUserProfile', token),

  // Administrative Endpoints
  loginAdmin: (email, pass, pin) => API.call('loginAdmin', email, pass, pin),
  getAdminData: () => API.call('getAdminData', AuthStore.getToken()),
  addChannel: (data) => API.call('addChannel', data, AuthStore.getToken()),
  updateChannel: (id, data) => API.call('updateChannel', id, data, AuthStore.getToken()),
  deleteChannel: (id) => API.call('deleteChannel', id, AuthStore.getToken()),
  toggleChannelStatus: (id) => API.call('toggleChannelStatus', id, AuthStore.getToken()),
  toggleFeatured: (id) => API.call('toggleFeatured', id, AuthStore.getToken()),
  parseM3U: (content) => API.call('parseM3U', content, AuthStore.getToken()),
  fetchAndParseM3UUrl: (url) => API.call('fetchAndParseM3UUrl', url, AuthStore.getToken()),
  importM3UFromUrlDirectly: (url) => API.call('importM3UFromUrlDirectly', url, AuthStore.getToken()),
  commitM3UImport: (items) => API.call('commitM3UImport', items, AuthStore.getToken()),
  updateSettings: (settings) => API.call('updateSettings', settings, AuthStore.getToken()),
  updateAdminCredentials: (cur, neu, pin) => API.call('updateAdminCredentials', cur, neu, pin, AuthStore.getToken()),
  uploadChannelLogo: (name, b64, mime) => API.call('uploadChannelLogo', name, b64, mime, AuthStore.getToken()),
  createDatabaseBackup: () => API.call('createDatabaseBackup', AuthStore.getToken()),
  getAdmins: () => API.call('getAdmins', AuthStore.getToken()),
  addAdmin: (data) => API.call('addAdmin', data, AuthStore.getToken()),
  getActivityLog: (limit) => API.call('getActivityLog', limit || 50, AuthStore.getToken()),
  addCategory: (data) => API.call('addCategory', data, AuthStore.getToken()),
  updateCategory: (id, data) => API.call('updateCategory', id, data, AuthStore.getToken()),
  deleteCategory: (id) => API.call('deleteCategory', id, AuthStore.getToken()),
  addCountry: (data) => API.call('addCountry', data, AuthStore.getToken()),
  updateCountry: (id, data) => API.call('updateCountry', id, data, AuthStore.getToken()),
  deleteCountry: (id) => API.call('deleteCountry', id, AuthStore.getToken()),
  addLanguage: (data) => API.call('addLanguage', data, AuthStore.getToken()),
  updateLanguage: (id, data) => API.call('updateLanguage', id, data, AuthStore.getToken()),
  deleteLanguage: (id) => API.call('deleteLanguage', id, AuthStore.getToken()),

  _simulateLocal: function(fnName) {
    if (fnName === 'getChannels') return [];
    if (fnName === 'isAdmin') return false;
    if (fnName === 'getCategories') return [];
    if (fnName === 'getCountries') return [];
    return null;
  }
};

/* ==========================================================================
   2. CLIENT-SIDE ROUTER & VIEW SWITCHER
   ========================================================================== */
const Router = {
  navigate: function(view, params = {}) {
    AppState.currentView = view;
    
    // Update active nav links
    document.querySelectorAll('.sf-nav-link').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-route') === view);
    });
    document.querySelectorAll('.sf-bottom-nav-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-bottom') === view);
    });

    // Hide all view containers
    document.querySelectorAll('.sf-view').forEach(v => {
      v.style.display = 'none';
    });

    // Target view container
    const target = document.getElementById(`view-${view}`);
    if (target) {
      target.style.display = 'block';
    }

    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Handle view-specific logic
    switch (view) {
      case 'home':
        renderHomeView();
        break;
      case 'browse':
        if (params.category) AppState.browseFilters.category = params.category;
        if (params.country) AppState.browseFilters.country = params.country;
        if (params.language) AppState.browseFilters.language = params.language;
        renderBrowseView();
        break;
      case 'countries':
        renderCountriesView();
        break;
      case 'categories':
        renderCategoriesView();
        break;
      case 'watch':
        if (params.id) {
          loadWatchChannel(params.id);
        }
        break;
      case 'favorites':
        renderFavoritesView();
        break;
      case 'history':
        renderHistoryView();
        break;
      case 'search':
        document.getElementById('mainSearchInput')?.focus();
        break;
      case 'admin':
        loadAdminDashboard();
        break;
      case 'reset':
        renderResetView(params.token);
        break;
    }

    // Update browser URL hash cleanly without full page refresh
    try {
      const hashParams = new URLSearchParams(params);
      const hashStr = hashParams.toString() ? `#view=${view}&${hashParams.toString()}` : `#view=${view}`;
      window.history.pushState(null, '', hashStr);
    } catch (e) {}
  },

  handleHashChange: function() {
    let view = 'home';
    const cleanParams = {};

    // 1. Check server-injected initialParams from doGet (e.g. ?view=reset&token=...)
    if (window.INITIAL_PARAMS && window.INITIAL_PARAMS.view && window.INITIAL_PARAMS.view !== 'home') {
      view = window.INITIAL_PARAMS.view;
      Object.keys(window.INITIAL_PARAMS).forEach(k => {
        if (k !== 'view' && window.INITIAL_PARAMS[k]) {
          cleanParams[k] = window.INITIAL_PARAMS[k];
        }
      });
      // Clear view so subsequent back/forward navigation behaves normally
      window.INITIAL_PARAMS.view = 'home';
    }

    // 2. Check query string in window.location.search
    if (window.location.search) {
      const searchParams = new URLSearchParams(window.location.search);
      if (searchParams.get('view')) view = searchParams.get('view');
      searchParams.forEach((val, key) => {
        if (key !== 'view') cleanParams[key] = val;
      });
    }

    // 3. Check hash in window.location.hash
    const hash = window.location.hash.substring(1);
    if (hash) {
      const hashParams = new URLSearchParams(hash);
      if (hashParams.get('view')) view = hashParams.get('view');
      hashParams.forEach((val, key) => {
        if (key !== 'view') cleanParams[key] = val;
      });
    }

    Router.navigate(view, cleanParams);
  }
};

/* ==========================================================================
   3. LOCAL STORAGE PERSISTENCE (FAVORITES & HISTORY)
   ========================================================================== */
const FavoritesStore = {
  KEY: 'streamflow_favorites',
  get: function() {
    try {
      const raw = localStorage.getItem(this.KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  },
  has: function(id) {
    return this.get().includes(String(id));
  },
  toggle: function(id) {
    const list = this.get();
    const strId = String(id);
    const index = list.indexOf(strId);
    let added = false;

    if (index > -1) {
      list.splice(index, 1);
    } else {
      list.push(strId);
      added = true;
    }

    try {
      localStorage.setItem(this.KEY, JSON.stringify(list));
    } catch (e) {}

    showToast(added ? 'Added to favorites' : 'Removed from favorites', 'info');
    updateFavoriteButtonsUI(strId, added);
    return added;
  }
};

const HistoryStore = {
  KEY: 'streamflow_history',
  MAX_ITEMS: 30,
  get: function() {
    try {
      const raw = localStorage.getItem(this.KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  },
  add: function(channel) {
    if (!channel || !channel.id) return;
    let list = this.get().filter(item => item.id !== channel.id);
    list.unshift({
      id: channel.id,
      name: channel.name,
      logo: channel.logo,
      country: channel.country,
      category: channel.category,
      stream_url: channel.stream_url,
      timestamp: Date.now()
    });

    if (list.length > this.MAX_ITEMS) {
      list = list.slice(0, this.MAX_ITEMS);
    }

    try {
      localStorage.setItem(this.KEY, JSON.stringify(list));
    } catch (e) {}
  },
  clear: function() {
    try {
      localStorage.removeItem(this.KEY);
      showToast('Watch history cleared', 'info');
    } catch (e) {}
  }
};

/* ==========================================================================
   4. VIDEO PLAYER LIFECYCLE (HLS.JS + HTML5)
   ========================================================================== */
const PlayerManager = {
  hls: null,
  videoEl: null,
  currentUrl: null,

  init: function() {
    this.videoEl = document.getElementById('sfVideoPlayer');
    if (!this.videoEl) return;

    this.videoEl.addEventListener('error', () => {
      this.showError();
    });

    this.videoEl.addEventListener('playing', () => {
      this.hideError();
    });
  },

  play: function(streamUrl, streamType = 'hls') {
    this.init();
    this.currentUrl = streamUrl;
    this.hideError();

    if (!streamUrl) {
      this.showError();
      return;
    }

    // Destroy existing Hls instance if any
    if (this.hls) {
      this.hls.destroy();
      this.hls = null;
    }

    const isHlsStream = streamUrl.toLowerCase().includes('.m3u8') || streamType === 'hls';

    // 1. Check Hls.js support
    if (isHlsStream && typeof Hls !== 'undefined' && Hls.isSupported()) {
      this.hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 60
      });

      this.hls.loadSource(streamUrl);
      this.hls.attachMedia(this.videoEl);

      this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
        this.videoEl.play().catch(e => {
          console.log('Autoplay blocked or waiting for user gesture:', e);
        });
      });

      this.hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              console.warn('Fatal network error encountered in stream, trying recovery...');
              this.hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              console.warn('Fatal media error encountered, recovering...');
              this.hls.recoverMediaError();
              break;
            default:
              console.error('Unrecoverable stream playback error');
              this.hls.destroy();
              this.showError();
              break;
          }
        }
      });
    }
    // 2. Native HLS playback (Safari, iOS)
    else if (this.videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      this.videoEl.src = streamUrl;
      this.videoEl.addEventListener('loadedmetadata', () => {
        this.videoEl.play().catch(e => console.log('Autoplay deferred:', e));
      }, { once: true });
    }
    // 3. Standard MP4 or video source
    else {
      this.videoEl.src = streamUrl;
      this.videoEl.play().catch(e => console.log('Playback deferred:', e));
    }
  },

  retry: function() {
    if (this.currentUrl) {
      this.play(this.currentUrl);
    }
  },

  showError: function() {
    const errOverlay = document.getElementById('playerErrorOverlay');
    if (errOverlay) errOverlay.classList.add('is-active');
  },

  hideError: function() {
    const errOverlay = document.getElementById('playerErrorOverlay');
    if (errOverlay) errOverlay.classList.remove('is-active');
  },

  stop: function() {
    if (this.videoEl) {
      this.videoEl.pause();
      this.videoEl.removeAttribute('src');
      this.videoEl.load();
    }
    if (this.hls) {
      this.hls.destroy();
      this.hls = null;
    }
  }
};

/* ==========================================================================
   5. UI GENERATION & CARD BUILDERS
   ========================================================================== */
function createChannelCard(ch) {
  const isFav = FavoritesStore.has(ch.id);
  const safeId = escapeHtml(ch.id);
  const safeName = escapeHtml(ch.name);
  const rawLogo = String(ch.logo || '').trim();
  const safeLogo = (rawLogo.startsWith('http://') || rawLogo.startsWith('https://') || rawLogo.startsWith('/')) 
    ? escapeHtml(rawLogo) 
    : '';
  const initial = ch.name ? ch.name.charAt(0).toUpperCase() : '?';

  return `
    <div class="sf-channel-card" data-channel-id="${safeId}">
      <div class="sf-card-banner">
        <span class="sf-live-badge">
          <span class="sf-live-dot"></span> LIVE
        </span>
        <button class="sf-fav-btn ${isFav ? 'is-favorite' : ''}" onclick="event.stopPropagation(); FavoritesStore.toggle('${safeId}');" title="Toggle Favorite">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFav ? '#EF4444' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </button>
        <div class="sf-card-logo-wrap">
          ${safeLogo 
            ? `<img src="${safeLogo}" alt="${safeName}" class="sf-card-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
               <span style="display:none; font-size: 1.5rem; font-weight: 800; color: var(--primary);">${escapeHtml(initial)}</span>`
            : `<span style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">${escapeHtml(initial)}</span>`
          }
        </div>
      </div>
      <div class="sf-card-body">
        <h3 class="sf-channel-title" title="${safeName}">${safeName}</h3>
        <div class="sf-tags">
          <span class="sf-tag">${escapeHtml(ch.category || 'General')}</span>
          <span class="sf-tag">${escapeHtml(ch.country || 'Global')}</span>
          ${ch.language ? `<span class="sf-tag">${escapeHtml(ch.language)}</span>` : ''}
        </div>
        <div class="sf-card-footer">
          <span style="font-size: 0.78rem; font-weight: 700; color: var(--success); display: inline-flex; align-items: center; gap: 4px;">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--success);"></span> Online
          </span>
          <button class="sf-btn sf-btn-primary sf-btn-sm" onclick="Router.navigate('watch', { id: '${safeId}' })">
            Watch Live
          </button>
        </div>
      </div>
    </div>
  `;
}

function updateFavoriteButtonsUI(channelId, isFav) {
  document.querySelectorAll(`.sf-channel-card[data-channel-id="${channelId}"] .sf-fav-btn`).forEach(btn => {
    btn.classList.toggle('is-favorite', isFav);
    const svg = btn.querySelector('svg');
    if (svg) svg.setAttribute('fill', isFav ? '#EF4444' : 'none');
  });

  // Watch page favorite button update
  if (AppState.currentChannel && AppState.currentChannel.id === channelId) {
    const watchFavBtn = document.getElementById('watchFavoriteBtn');
    const watchFavText = document.getElementById('watchFavoriteText');
    if (watchFavBtn && watchFavText) {
      watchFavBtn.classList.toggle('is-favorite', isFav);
      watchFavText.textContent = isFav ? 'Favorited' : 'Favorite';
      const svg = watchFavBtn.querySelector('svg');
      if (svg) svg.setAttribute('fill', isFav ? '#EF4444' : 'none');
    }
  }
}

/* ==========================================================================
   6. VIEW RENDERING LOGIC
   ========================================================================== */
function renderHomeView() {
  // 1. Featured Channels
  const featuredGrid = document.getElementById('homeFeaturedGrid');
  const featured = AppState.channels.filter(c => c.is_featured);

  if (featured.length > 0) {
    featuredGrid.innerHTML = featured.map(createChannelCard).join('');
  } else if (AppState.channels.length > 0) {
    // Show first 4 channels if no featured explicitly set
    featuredGrid.innerHTML = AppState.channels.slice(0, 4).map(createChannelCard).join('');
  } else {
    featuredGrid.innerHTML = `
      <div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--text-muted);">
        No live channels configured yet. Administrator can add channels via the Admin Console.
      </div>`;
  }

  // 2. Categories Highlights
  const catGrid = document.getElementById('homeCategoriesGrid');
  if (AppState.categories.length > 0) {
    catGrid.innerHTML = AppState.categories.slice(0, 6).map(cat => `
      <div class="sf-category-card" onclick="Router.navigate('browse', { category: decodeURIComponent('${encodeURIComponent(cat.name)}') })">
        <div class="sf-cat-icon">📺</div>
        <div>
          <h4 style="font-size: 1rem; font-weight: 700;">${escapeHtml(cat.name)}</h4>
          <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">${cat.channel_count || 0} channels</span>
        </div>
      </div>
    `).join('');
  }

  // 3. Countries Highlights
  const cntGrid = document.getElementById('homeCountriesGrid');
  if (AppState.countries.length > 0) {
    cntGrid.innerHTML = AppState.countries.slice(0, 6).map(c => `
      <div class="sf-country-card" onclick="Router.navigate('browse', { country: decodeURIComponent('${encodeURIComponent(c.name)}') })">
        <div class="sf-country-flag">${escapeHtml(c.flag || '🌐')}</div>
        <div>
          <h4 style="font-size: 1rem; font-weight: 700;">${escapeHtml(c.name)}</h4>
          <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">${c.channel_count || 0} channels</span>
        </div>
      </div>
    `).join('');
  }

  // 4. Recently Watched
  renderRecentlyWatched();
}

function renderRecentlyWatched() {
  const recSection = document.getElementById('homeRecentlyWatchedSection');
  const recGrid = document.getElementById('homeRecentlyWatchedGrid');
  const historyItems = HistoryStore.get();

  if (historyItems.length > 0) {
    recSection.style.display = 'block';
    // Map items to channel card structure
    recGrid.innerHTML = historyItems.slice(0, 4).map(createChannelCard).join('');
  } else {
    recSection.style.display = 'none';
  }
}

function renderBrowseView() {
  // Populate category pills
  const pillsWrap = document.getElementById('browseCategoryPills');
  let pillsHtml = `<div class="sf-pill ${AppState.browseFilters.category === 'all' ? 'active' : ''}" onclick="setBrowseCategory('all')">All Categories</div>`;
  AppState.categories.forEach(cat => {
    const isActive = AppState.browseFilters.category.toLowerCase() === cat.name.toLowerCase();
    pillsHtml += `<div class="sf-pill ${isActive ? 'active' : ''}" onclick="setBrowseCategory('${cat.name}')">${escapeHtml(cat.name)}</div>`;
  });
  pillsWrap.innerHTML = pillsHtml;

  // Populate Country & Language dropdowns
  const countrySelect = document.getElementById('browseCountrySelect');
  if (countrySelect.options.length <= 1) {
    AppState.countries.forEach(cnt => {
      const opt = document.createElement('option');
      opt.value = cnt.name;
      opt.textContent = `${cnt.flag || ''} ${cnt.name}`;
      countrySelect.appendChild(opt);
    });
  }
  if (AppState.browseFilters.country) {
    countrySelect.value = AppState.browseFilters.country;
  }

  const langSelect = document.getElementById('browseLanguageSelect');
  if (langSelect.options.length <= 1) {
    AppState.languages.forEach(lng => {
      const opt = document.createElement('option');
      opt.value = lng.name;
      opt.textContent = lng.name;
      langSelect.appendChild(opt);
    });
  }
  if (AppState.browseFilters.language) {
    langSelect.value = AppState.browseFilters.language;
  }

  applyBrowseFilters();
}

function setBrowseCategory(catName) {
  AppState.browseFilters.category = catName;
  document.querySelectorAll('#browseCategoryPills .sf-pill').forEach(pill => {
    pill.classList.toggle('active', pill.textContent.trim().toLowerCase() === (catName === 'all' ? 'all categories' : catName.toLowerCase()));
  });
  applyBrowseFilters();
}

function applyBrowseFilters() {
  const countryVal = document.getElementById('browseCountrySelect').value;
  const langVal = document.getElementById('browseLanguageSelect').value;
  const sortVal = document.getElementById('browseSortSelect').value;
  const catVal = AppState.browseFilters.category;

  let filtered = [...AppState.channels];

  // Category filter
  if (catVal && catVal !== 'all') {
    filtered = filtered.filter(ch => (ch.category || '').toLowerCase() === catVal.toLowerCase());
  }

  // Country filter
  if (countryVal) {
    filtered = filtered.filter(ch => (ch.country || '').toLowerCase() === countryVal.toLowerCase());
  }

  // Language filter
  if (langVal) {
    filtered = filtered.filter(ch => (ch.language || '').toLowerCase() === langVal.toLowerCase());
  }

  // Sorting
  if (sortVal === 'az') {
    filtered.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sortVal === 'za') {
    filtered.sort((a, b) => b.name.localeCompare(a.name));
  } else if (sortVal === 'country') {
    filtered.sort((a, b) => a.country.localeCompare(b.country) || a.name.localeCompare(b.name));
  } else {
    // Featured first
    filtered.sort((a, b) => (b.is_featured ? 1 : 0) - (a.is_featured ? 1 : 0) || a.sort_order - b.sort_order);
  }

  // Update counts
  const countBadge = document.getElementById('browseChannelCount');
  countBadge.textContent = `${filtered.length} Channels`;

  // Render Grid
  const grid = document.getElementById('browseChannelGrid');
  const empty = document.getElementById('browseEmptyState');

  if (filtered.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = filtered.map(createChannelCard).join('');
  }
}

function setupWatchPlayer(channel) {
  AppState.currentChannel = channel;

  // Set Title & Meta
  document.getElementById('watchChannelName').textContent = channel.name;
  document.getElementById('watchTagCountry').textContent = channel.country || 'Global';
  document.getElementById('watchTagCategory').textContent = channel.category || 'General';
  document.getElementById('watchTagLanguage').textContent = channel.language || 'English';
  document.getElementById('watchChannelDesc').textContent = channel.description || 'No channel description provided.';

  // Logo
  const logoEl = document.getElementById('watchChannelLogo');
  const rawLogo = String(channel.logo || '').trim();
  if (rawLogo.startsWith('http://') || rawLogo.startsWith('https://') || rawLogo.startsWith('/')) {
    logoEl.src = rawLogo;
    logoEl.style.display = 'block';
  } else {
    logoEl.removeAttribute('src');
    logoEl.style.display = 'none';
  }

  // Favorite status
  const isFav = FavoritesStore.has(channel.id);
  const watchFavBtn = document.getElementById('watchFavoriteBtn');
  const watchFavText = document.getElementById('watchFavoriteText');
  watchFavBtn.classList.toggle('is-favorite', isFav);
  watchFavText.textContent = isFav ? 'Favorited' : 'Favorite';
  const svg = watchFavBtn.querySelector('svg');
  if (svg) svg.setAttribute('fill', isFav ? '#EF4444' : 'none');

  // Related Channels
  const relatedList = document.getElementById('watchRelatedList');
  const related = AppState.channels
    .filter(c => c.id !== channel.id && (c.category === channel.category || c.country === channel.country))
    .slice(0, 5);

  if (related.length > 0) {
    relatedList.innerHTML = related.map(c => {
      const safeId = escapeHtml(c.id);
      const safeName = escapeHtml(c.name);
      return `
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-subtle); border-radius: var(--radius-sm); cursor: pointer;" onclick="Router.navigate('watch', { id: '${safeId}' })">

        </div>

    `;
    }).join('');
  } else {
    relatedList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem;">No related channels found.</div>';
  }

  // Record into Local Watch History
  HistoryStore.add(channel);

  // Stream Playback
  PlayerManager.play(channel.stream_url, channel.stream_type);
}

let searchDebounceTimer = null;

function handleSearchInput(e) {
  const q = e.target.value.trim();
  const clearBtn = document.getElementById('mainSearchClearBtn');
  clearBtn.style.display = q ? 'block' : 'none';

  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    executeSearch(q);
  }, 250);
}

function clearMainSearch() {
  const input = document.getElementById('mainSearchInput');
  input.value = '';
  document.getElementById('mainSearchClearBtn').style.display = 'none';
  executeSearch('');
}

function executeSearch(query) {
  const summary = document.getElementById('searchSummaryText');
  const count = document.getElementById('searchResultCount');
  const grid = document.getElementById('searchResultsGrid');
  const empty = document.getElementById('searchEmptyState');

  if (!query) {
    summary.textContent = 'Start typing to search...';
    count.textContent = '';
    grid.innerHTML = '';
    empty.style.display = 'none';
    return;
  }

  const q = query.toLowerCase();
  const matches = AppState.channels.filter(ch => 
    ch.name.toLowerCase().includes(q) ||
    ch.country.toLowerCase().includes(q) ||
    ch.category.toLowerCase().includes(q) ||
    ch.language.toLowerCase().includes(q) ||
    (ch.description && ch.description.toLowerCase().includes(q))
  );

  summary.textContent = `Results for "${query}"`;
  count.textContent = `${matches.length} found`;

  if (matches.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = matches.map(createChannelCard).join('');
  }
}

function filterAdminChannelsTable() {
  if (!AppState.adminData) return;
  const q = document.getElementById('adminChannelSearch').value.toLowerCase();
  const cat = document.getElementById('adminCategoryFilter').value.toLowerCase();
  const status = document.getElementById('adminStatusFilter').value;

  const filtered = AppState.adminData.channels.filter(ch => {
    const matchQ = !q || ch.name.toLowerCase().includes(q) || ch.country.toLowerCase().includes(q) || ch.stream_url.toLowerCase().includes(q);
    const matchCat = !cat || ch.category.toLowerCase() === cat;
    let matchStatus = true;
    if (status === 'active') matchStatus = ch.is_active;
    if (status === 'inactive') matchStatus = !ch.is_active;
    if (status === 'featured') matchStatus = ch.is_featured;
    return matchQ && matchCat && matchStatus;
  });

  renderAdminChannelsTable(filtered);
}

function handleChannelFormSubmit(e) {
  e.preventDefault();
  const id = document.getElementById('channelFormId').value;
  const logoFileInput = document.getElementById('formLogoFile');

  const payload = {
    name: document.getElementById('formChannelName').value,
    stream_url: document.getElementById('formStreamUrl').value,
    country: document.getElementById('formCountry').value,
    country_code: document.getElementById('formCountryCode').value,
    category: document.getElementById('formCategory').value,
    language: document.getElementById('formLanguage').value,
    logo: document.getElementById('formLogoUrl').value,
    description: document.getElementById('formDescription').value,
    is_active: document.getElementById('formIsActive').checked,
    is_featured: document.getElementById('formIsFeatured').checked,
    stream_type: 'hls'
  };

  const submitBtn = document.getElementById('channelSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving...';

  // Handle Logo File Upload to Google Drive if selected
  if (logoFileInput.files && logoFileInput.files[0]) {
    const file = logoFileInput.files[0];
    const reader = new FileReader();
    reader.onload = function(evt) {
      const base64 = evt.target.result;
      API.uploadChannelLogo(file.name, base64, file.type).then(uploadedUrl => {
        payload.logo = uploadedUrl;
        saveChannelPayload(id, payload);
      }).catch(err => {
        showToast('Logo upload failed: ' + err.message, 'error');
        saveChannelPayload(id, payload);
      });
    };
    reader.readAsDataURL(file);
  } else {
    saveChannelPayload(id, payload);
  }
}

function saveChannelPayload(id, payload) {
  const isEdit = Boolean(id);
  const promise = isEdit ? API.updateChannel(id, payload) : API.addChannel(payload);

  promise.then(() => {
    showToast(isEdit ? 'Channel updated successfully' : 'Channel added successfully', 'success');
    closeModal('channelModalOverlay');
    document.getElementById('channelSubmitBtn').disabled = false;
    document.getElementById('channelSubmitBtn').textContent = 'Save Channel';
    loadAdminDashboard();
    bootstrapApp(); // Refresh public cache
  }).catch(err => {
    showToast('Failed to save channel: ' + err.message, 'error');
    document.getElementById('channelSubmitBtn').disabled = false;
    document.getElementById('channelSubmitBtn').textContent = 'Save Channel';
  });
}

function renderResetView(token) {
  const form = document.getElementById('resetPasswordForm');
  const tokenInput = document.getElementById('resetPasswordToken');
  const successState = document.getElementById('resetSuccessState');
  const invalidState = document.getElementById('resetInvalidState');
  const alertBox = document.getElementById('resetAlertBox');

  if (alertBox) alertBox.style.display = 'none';
  if (successState) successState.style.display = 'none';
  if (invalidState) invalidState.style.display = 'none';

  const actualToken = token || (tokenInput ? tokenInput.value : '');
  if (!actualToken) {
    if (form) form.style.display = 'none';
    if (invalidState) invalidState.style.display = 'block';
    return;
  }

  if (tokenInput) tokenInput.value = actualToken;
  if (form) form.style.display = 'block';
}

function handleResetPasswordSubmit(e) {
  e.preventDefault();
  const token = document.getElementById('resetPasswordToken').value.trim();
  const newPass = document.getElementById('resetNewPassword').value;
  const confirmPass = document.getElementById('resetConfirmPassword').value;
  const btn = document.getElementById('resetPasswordSubmitBtn');
  const alertBox = document.getElementById('resetAlertBox');
  const form = document.getElementById('resetPasswordForm');
  const successState = document.getElementById('resetSuccessState');

  if (newPass !== confirmPass) {
    if (alertBox) {
      alertBox.style.background = 'rgba(239, 68, 68, 0.1)';
      alertBox.style.color = '#EF4444';
      alertBox.style.border = '1px solid rgba(239, 68, 68, 0.2)';
      alertBox.textContent = 'Passwords do not match.';
      alertBox.style.display = 'block';
    }
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Updating password...';

  API.resetPasswordWithToken(token, newPass).then(res => {
    btn.disabled = false;
    btn.textContent = 'Update Password';
    if (form) form.style.display = 'none';
    if (successState) successState.style.display = 'block';
    showToast('Password updated successfully!', 'success');
  }).catch(err => {
    btn.disabled = false;
    btn.textContent = 'Update Password';
    if (alertBox) {
      alertBox.style.background = 'rgba(239, 68, 68, 0.1)';
      alertBox.style.color = '#EF4444';
      alertBox.style.border = '1px solid rgba(239, 68, 68, 0.2)';
      alertBox.textContent = err.message || 'Failed to update password.';
      alertBox.style.display = 'block';
    }
  });
}

/* ==========================================================================
   9. M3U PLAYLIST IMPORT WORKFLOW
   ========================================================================== */
function openM3UModal() {
  document.getElementById('m3uUrlInput').value = '';
  document.getElementById('m3uTextarea').value = '';
  document.getElementById('m3uPreviewArea').style.display = 'none';
  document.getElementById('m3uCommitBtn').style.display = 'none';
  switchM3uTab('url');
  openModal('m3uModalOverlay');
}

function switchM3uTab(mode) {
  ['url', 'file', 'text'].forEach(m => {
    const panel = document.getElementById(`m3uPanel-${m}`);
    const btn = document.getElementById(`m3uTabBtn-${m}`);
    if (panel) panel.style.display = m === mode ? 'block' : 'none';
    if (btn) btn.classList.toggle('active', m === mode);
  });
}

function fetchM3UFromUrl() {
  const url = document.getElementById('m3uUrlInput').value.trim();
  if (!url) {
    showToast('Please enter a valid M3U playlist URL.', 'error');
    return;
  }

  AppState.m3uLastUrl = url;
  const btn = document.getElementById('m3uFetchUrlBtn');
  btn.disabled = true;
  btn.textContent = 'Fetching...';
  showToast('Fetching and analyzing playlist...', 'info');

  API.fetchAndParseM3UUrl(url).then(report => {
    renderM3uPreviewReport(report);
    btn.disabled = false;
    btn.textContent = 'Fetch & Analyze';
  }).catch(err => {
    showToast('Failed to fetch M3U URL: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Fetch & Analyze';
  });
}

function handleM3UFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  AppState.m3uLastUrl = null;
  const reader = new FileReader();
  reader.onload = function(evt) {
    document.getElementById('m3uTextarea').value = evt.target.result;
    parseM3UContent();
  };
  reader.readAsText(file);
}

function renderM3uPreviewReport(report) {
  document.getElementById('m3uTotalFound').textContent = report.total_detected;
  document.getElementById('m3uNewCount').textContent = report.new_count;
  document.getElementById('m3uDupCount').textContent = report.duplicate_count;
  document.getElementById('m3uInvalidCount').textContent = report.invalid_count;

  AppState.m3uParsedItems = (report.items || []).filter(item => !item.is_duplicate);

  const tbody = document.getElementById('m3uPreviewTableBody');
  tbody.innerHTML = (report.items || []).map(item => `
    <tr>
      <td><strong>${escapeHtml(item.name)}</strong></td>
      <td>${escapeHtml(item.category)}</td>
      <td>${escapeHtml(item.country)}</td>
      <td>
        <span style="color: ${item.is_duplicate ? 'var(--warning)' : 'var(--success)'}; font-weight: 700;">
          ${item.is_duplicate ? 'Duplicate (Skip)' : 'New'}
        </span>
      </td>
    </tr>
  `).join('');

  document.getElementById('m3uPreviewArea').style.display = 'block';
  const commitBtn = document.getElementById('m3uCommitBtn');
  const mainBtn = document.getElementById('m3uMainActionBtn');
  const mainText = document.getElementById('m3uMainActionText');
  const countToImport = report.new_count !== undefined ? report.new_count : AppState.m3uParsedItems.length;

  if (countToImport > 0) {
    if (commitBtn) {
      commitBtn.style.display = 'inline-flex';
      commitBtn.textContent = `Import ${countToImport} New Channels`;
    }
    if (mainBtn) {
      mainBtn.style.display = 'inline-flex';
    }
    if (mainText) {
      mainText.textContent = `Import ${countToImport} New Channels`;
    }
  } else {
    if (commitBtn) commitBtn.style.display = 'none';
    if (mainBtn) mainBtn.style.display = 'none';
  }
}

function parseM3UContent() {
  const content = document.getElementById('m3uTextarea').value;
  if (!content.trim()) {
    showToast('Please provide M3U playlist text or upload a file.', 'error');
    return;
  }

  AppState.m3uLastUrl = null;
  showToast('Parsing and checking duplicates...', 'info');
  API.parseM3U(content).then(report => {
    renderM3uPreviewReport(report);
  }).catch(err => {
    showToast('Failed to parse M3U: ' + err.message, 'error');
  });
}

function commitM3UChannels() {
  const btn = document.getElementById('m3uCommitBtn');
  const mainBtn = document.getElementById('m3uMainActionBtn');
  const mainText = document.getElementById('m3uMainActionText');

  const setLoading = (msg) => {
    if (btn) { btn.disabled = true; btn.textContent = msg; }
    if (mainBtn) { mainBtn.disabled = true; }
    if (mainText) { mainText.textContent = msg; }
    showToast(msg, 'info');
  };

  const resetLoading = () => {
    if (btn) { btn.disabled = false; btn.textContent = 'Import Valid Channels'; }
    if (mainBtn) { mainBtn.disabled = false; }
    if (mainText) { mainText.textContent = 'Import All New Channels'; }
  };

  setLoading('Importing channels to Google Sheets database...');

  // If imported via URL, use server-side direct import (handles 10,000+ items seamlessly)
  if (AppState.m3uLastUrl) {
    API.importM3UFromUrlDirectly(AppState.m3uLastUrl).then(res => {
      showToast(`Successfully imported ${res.imported} new channels into database!`, 'success');
      closeModal('m3uModalOverlay');
      resetLoading();
      loadAdminDashboard();
      bootstrapApp();
    }).catch(err => {
      showToast('Import failed: ' + err.message, 'error');
      resetLoading();
    });
  } else if (AppState.m3uParsedItems && AppState.m3uParsedItems.length > 0) {
    API.commitM3UImport(AppState.m3uParsedItems).then(count => {
      showToast(`Successfully imported ${count} channels!`, 'success');
      closeModal('m3uModalOverlay');
      resetLoading();
      loadAdminDashboard();
      bootstrapApp();
    }).catch(err => {
      showToast('Import failed: ' + err.message, 'error');
      resetLoading();
    });
  } else {
    showToast('No new channels to import.', 'info');
    resetLoading();
  }
}

/* ==========================================================================
   10. MODALS, TOASTS & UTILITIES
   ========================================================================== */
function openModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.add('is-active');
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('is-active');
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `sf-toast sf-toast-${type}`;
  toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(12px)';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* ==========================================================================
   11. APPLICATION BOOTSTRAP
   ========================================================================== */
function bootstrapApp() {
  // Update year
  const yearEl = document.getElementById('currentYear');
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  // Parallel initial data fetching
  Promise.all([
    API.getChannels(),
    API.getCategories(),
    API.getCountries(),
    API.getLanguages(),
    API.getSettings(),
    API.isAdmin()
  ]).then(([channels, categories, countries, languages, settings, isAdmin]) => {
    AppState.channels = channels || [];
    AppState.categories = categories || [];
    AppState.countries = countries || [];
    AppState.languages = languages || [];
    AppState.settings = settings || {};
    AppState.isAdmin = Boolean(isAdmin) || AuthStore.isLoggedIn();

    if (AppState.isAdmin || AuthStore.isLoggedIn()) {
      updateAdminNavUI(true, AuthStore.getEmail());
    } else {
      updateAdminNavUI(false);
    }

    // Initialize User Navigation UI
    updateUserNavUI();

    // Apply custom site name from settings if present
    if (settings && settings.site_name) {
      document.title = `${settings.site_name} — Live TV`;
    }

    // Route according to initial hash or default to home
    Router.handleHashChange();

    // In Google Apps Script environment, listen to location parameters
    if (typeof google !== 'undefined' && google.script && google.script.url) {
      try {
        google.script.url.getLocation(function(location) {
          if (location && location.parameter && location.parameter.view) {
            Router.navigate(location.parameter.view, location.parameter);
          }
        });
      } catch (e) {}
    }
  }).catch(err => {
    console.error('Bootstrap error:', err);
    updateUserNavUI();
    Router.handleHashChange();
  });
}

// Global Event Listeners
window.addEventListener('DOMContentLoaded', () => {
  bootstrapApp();
});

window.addEventListener('hashchange', () => {
  Router.handleHashChange();
});

// Shortcut: press '/' to search
window.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    Router.navigate('search');
  }
});
