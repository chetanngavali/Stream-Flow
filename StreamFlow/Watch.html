<!-- Watch / Player View Template -->
<div class="sf-view" id="view-watch" style="display: none;">
  <div style="margin-bottom: 20px;">
    <a href="javascript:void(0)" onclick="Router.navigate('browse')" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.88rem; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Back to Channels
    </a>
  </div>

  <div class="sf-player-layout">
    <!-- Main Video & Metadata Column -->
    <div>
      <div class="sf-player-container" id="playerContainer">
        <video id="sfVideoPlayer" class="sf-video" controls playsinline poster="" preload="auto"></video>
        
        <!-- Player Error State Screen -->
        <div class="sf-player-error" id="playerErrorOverlay">
          <div class="sf-player-error-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
          </div>
          <h3>Unable to play this stream</h3>
          <p>The channel broadcast may be temporarily offline, experiencing technical difficulties, or restricted in your network region.</p>
          <div style="display: flex; gap: 12px; align-items: center;">
            <button class="sf-btn sf-btn-primary sf-btn-sm" onclick="PlayerManager.retry()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
              Retry Playback
            </button>
            <button class="sf-btn sf-btn-secondary sf-btn-sm" onclick="Router.navigate('browse')">
              Back to Channels
            </button>
          </div>
        </div>
      </div>

      <!-- Channel Metadata Banner -->
      <div class="sf-stream-meta">
        <div class="sf-stream-meta-header">
          <div style="display: flex; align-items: center; gap: 16px;">
            <div id="watchChannelLogoWrap" class="sf-card-logo-wrap" style="width: 56px; height: 56px;">
              <img id="watchChannelLogo" src="" alt="Channel Logo" class="sf-card-logo">
            </div>
            <div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <h1 id="watchChannelName" style="font-size: 1.45rem; font-weight: 800;">Channel Name</h1>
                <span class="sf-live-badge" style="position: static; transform: none; padding: 2px 8px; font-size: 0.68rem;">
                  <span class="sf-live-dot"></span> LIVE
                </span>
              </div>
              <div class="sf-tags" style="margin: 6px 0 0 0;">
                <span class="sf-tag" id="watchTagCountry">Country</span>
                <span class="sf-tag" id="watchTagCategory">Category</span>
                <span class="sf-tag" id="watchTagLanguage">Language</span>
              </div>
            </div>
          </div>

          <div>
            <button class="sf-btn sf-btn-secondary sf-btn-sm" id="watchFavoriteBtn" onclick="toggleWatchFavorite()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
              <span id="watchFavoriteText">Favorite</span>
            </button>
          </div>
        </div>

        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-light);">
          <h4 style="font-size: 0.92rem; font-weight: 700; margin-bottom: 6px; color: var(--text-secondary);">About This Channel</h4>
          <p id="watchChannelDesc" style="color: var(--text-muted); font-size: 0.92rem; line-height: 1.6;">
            No description provided.
          </p>
        </div>
      </div>
    </div>

    <!-- Related Channels Sidebar -->
    <div>
      <div style="background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm);">
        <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;">Related Channels</h3>
        <div id="watchRelatedList" style="display: flex; flex-direction: column; gap: 12px;">
          <!-- Injected dynamically -->
        </div>
      </div>
    </div>
  </div>
</div>
