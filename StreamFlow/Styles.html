<style>
/* ==========================================================================
   STREAMFLOW — PREMIUM DESIGN SYSTEM (LIGHT-MODE FIRST)
   ========================================================================== */

:root {
  --bg-main: #F8F9FC;
  --bg-surface: #FFFFFF;
  --bg-surface-glass: rgba(255, 255, 255, 0.82);
  --bg-surface-elevated: #FFFFFF;
  --bg-subtle: #F0F2F8;

  --primary: #6D5DFB;
  --primary-hover: #5B4BE3;
  --primary-light: rgba(109, 93, 251, 0.08);
  --secondary: #4F8CFF;
  --accent-gradient: linear-gradient(135deg, #6D5DFB 0%, #4F8CFF 100%);
  --accent-gradient-hover: linear-gradient(135deg, #5B4BE3 0%, #3B78F0 100%);
  
  --text-primary: #151827;
  --text-secondary: #4B5565;
  --text-muted: #6B7280;
  --text-inverse: #FFFFFF;

  --border-light: #E8EAF2;
  --border-subtle: #F0F2F6;
  --border-focus: #6D5DFB;

  --success: #10B981;
  --success-bg: rgba(16, 185, 129, 0.1);
  --danger: #EF4444;
  --danger-bg: rgba(239, 68, 68, 0.1);
  --warning: #F59E0B;
  --live-pulse: #EF4444;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-display: 'Outfit', 'Inter', -apple-system, sans-serif;

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 6px rgba(21, 24, 39, 0.03);
  --shadow-md: 0 4px 16px -2px rgba(21, 24, 39, 0.05), 0 2px 4px rgba(21, 24, 39, 0.02);
  --shadow-lg: 0 10px 30px -4px rgba(21, 24, 39, 0.08), 0 4px 12px rgba(109, 93, 251, 0.04);
  --shadow-glow: 0 0 24px rgba(109, 93, 251, 0.25);

  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-smooth: 0.35s cubic-bezier(0.16, 1, 0.3, 1);

  --header-height: 72px;
  --bottom-nav-height: 64px;
}

/* Reset & Box Sizing */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-main);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* Typography */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.25;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  border: none;
  outline: none;
  background: none;
}

button {
  cursor: pointer;
  user-select: none;
}

/* Container */
.sf-container {
  width: 100%;
  max-width: 1360px;
  margin-left: auto;
  margin-right: auto;
  padding-left: 24px;
  padding-right: 24px;
}

/* Main Layout */
.sf-main {
  flex: 1 0 auto;
  padding-top: calc(var(--header-height) + 24px);
  padding-bottom: 60px;
}

/* Header & Navigation */
.sf-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-height);
  background: var(--bg-surface-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-light);
  z-index: 1000;
  display: flex;
  align-items: center;
  transition: box-shadow var(--transition-fast);
}

.sf-header.is-scrolled {
  box-shadow: var(--shadow-sm);
}

.sf-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 20px;
}

/* Logo */
.sf-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.sf-logo-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  box-shadow: 0 4px 12px rgba(109, 93, 251, 0.3);
}

.sf-logo-text span {
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Nav Links */
.sf-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sf-nav-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-size: 0.93rem;
  font-weight: 600;
  color: var(--text-secondary);
  border-radius: var(--radius-full);
  transition: all var(--transition-fast);
}

.sf-nav-link:hover {
  color: var(--primary);
  background-color: var(--primary-light);
}

.sf-nav-link.active {
  color: var(--primary);
  background-color: var(--primary-light);
}

.sf-nav-link svg {
  width: 18px;
  height: 18px;
}

.sf-admin-badge {
  background: #10B981;
  color: white;
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: var(--radius-full);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 0.05em;
}

/* Header Right Actions */
.sf-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.sf-search-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-full);
  padding: 8px 16px;
  color: var(--text-muted);
  font-size: 0.88rem;
  transition: all var(--transition-fast);
  cursor: pointer;
}

.sf-search-trigger:hover {
  border-color: var(--primary);
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: 0 0 0 3px rgba(109, 93, 251, 0.12);
}

.sf-search-shortcut {
  font-size: 0.72rem;
  font-weight: 700;
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  padding: 2px 6px;
  border-radius: var(--radius-xs);
  color: var(--text-secondary);
}

/* Buttons */
.sf-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  font-size: 0.92rem;
  font-weight: 600;
  border-radius: var(--radius-full);
  transition: all var(--transition-fast);
  text-align: center;
  cursor: pointer;
}

.sf-btn-primary {
  background: var(--accent-gradient);
  color: #FFFFFF;
  box-shadow: 0 4px 14px rgba(109, 93, 251, 0.28);
}

.sf-btn-primary:hover {
  background: var(--accent-gradient-hover);
  box-shadow: 0 6px 20px rgba(109, 93, 251, 0.38);
  transform: translateY(-1px);
}

.sf-btn-secondary {
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-sm);
}

.sf-btn-secondary:hover {
  background: var(--bg-subtle);
  border-color: #D1D5DB;
  transform: translateY(-1px);
}

.sf-btn-outline {
  border: 1.5px solid var(--primary);
  color: var(--primary);
  background: transparent;
}

.sf-btn-outline:hover {
  background: var(--primary-light);
}

.sf-btn-danger {
  background: var(--danger);
  color: #FFFFFF;
}

.sf-btn-danger:hover {
  background: #DC2626;
}

.sf-btn-sm {
  padding: 6px 12px;
  font-size: 0.82rem;
}

.sf-btn-icon {
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Section Header */
.sf-section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 16px;
}

.sf-section-title {
  font-size: 1.65rem;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.sf-section-subtitle {
  color: var(--text-muted);
  font-size: 0.95rem;
  margin-top: 4px;
}

/* Cards Grid */
.sf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}

/* Channel Card */
.sf-channel-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-normal);
  display: flex;
  flex-direction: column;
  position: relative;
}

.sf-channel-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(109, 93, 251, 0.25);
}

.sf-card-banner {
  height: 140px;
  background: linear-gradient(135deg, #F0F2F8 0%, #E8EAF2 100%);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: hidden;
}

.sf-card-logo-wrap {
  width: 80px;
  height: 80px;
  border-radius: var(--radius-md);
  background: #FFFFFF;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 8px;
}

.sf-card-logo {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.sf-live-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(239, 68, 68, 0.92);
  backdrop-filter: blur(4px);
  color: #FFFFFF;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  border-radius: var(--radius-full);
  text-transform: uppercase;
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
}

.sf-live-dot {
  width: 6px;
  height: 6px;
  background-color: #FFFFFF;
  border-radius: 50%;
  animation: sfPulse 1.5s infinite;
}

@keyframes sfPulse {
  0% { transform: scale(0.95); opacity: 0.7; }
  50% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.7; }
}

.sf-fav-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-fast);
}

.sf-fav-btn:hover {
  color: #EF4444;
  transform: scale(1.1);
  background: #FFFFFF;
}

.sf-fav-btn.is-favorite {
  color: #EF4444;
}

.sf-card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.sf-channel-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sf-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

.sf-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius-xs);
  background: var(--bg-subtle);
  color: var(--text-secondary);
}

.sf-card-footer {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
}

/* Category & Country Cards */
.sf-category-card, .sf-country-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-normal);
  cursor: pointer;
}

.sf-category-card:hover, .sf-country-card:hover {
  border-color: var(--primary);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.sf-cat-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-sm);
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
}

.sf-country-flag {
  font-size: 2rem;
  line-height: 1;
}

/* Hero Section */
.sf-hero {
  background: linear-gradient(180deg, #FFFFFF 0%, #F4F6FC 100%);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-xl);
  padding: 60px 48px;
  margin-bottom: 48px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

.sf-hero::after {
  content: '';
  position: absolute;
  top: -80px;
  right: -80px;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(109, 93, 251, 0.15) 0%, rgba(79, 140, 255, 0) 70%);
  border-radius: 50%;
  pointer-events: none;
}

.sf-hero-content {
  max-width: 640px;
  position: relative;
  z-index: 1;
}

.sf-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--primary-light);
  color: var(--primary);
  font-size: 0.8rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  margin-bottom: 20px;
}

.sf-hero-title {
  font-size: 3rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin-bottom: 16px;
  color: var(--text-primary);
}

.sf-hero-title span {
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.sf-hero-desc {
  font-size: 1.15rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 28px;
}

.sf-hero-actions {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

/* Filter Bar */
.sf-filter-bar {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}

.sf-filter-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.sf-filter-select {
  padding: 8px 14px;
  border: 1px solid var(--border-light);
  background: var(--bg-subtle);
  border-radius: var(--radius-full);
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.sf-filter-select:hover, .sf-filter-select:focus {
  border-color: var(--primary);
  background: #FFFFFF;
}

.sf-pills {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}

.sf-pill {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-subtle);
  white-space: nowrap;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.sf-pill:hover {
  background: var(--border-light);
}

.sf-pill.active {
  background: var(--primary);
  color: #FFFFFF;
  box-shadow: 0 2px 8px rgba(109, 93, 251, 0.3);
}

/* Video Player Page */
.sf-player-layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 32px;
}

.sf-player-container {
  background: #000000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
  position: relative;
  aspect-ratio: 16 / 9;
  width: 100%;
}

.sf-video {
  width: 100%;
  height: 100%;
  display: block;
  background: #000000;
}

.sf-player-error {
  position: absolute;
  inset: 0;
  background: #0B0D17;
  color: #FFFFFF;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  text-align: center;
  z-index: 10;
}

.sf-player-error.is-active {
  display: flex;
}

.sf-player-error-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(239, 68, 68, 0.15);
  color: #EF4444;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}

.sf-player-error h3 {
  color: #FFFFFF;
  font-size: 1.35rem;
  margin-bottom: 8px;
}

.sf-player-error p {
  color: #9CA3AF;
  font-size: 0.95rem;
  max-width: 420px;
  margin-bottom: 20px;
}

.sf-stream-meta {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-top: 24px;
  box-shadow: var(--shadow-sm);
}

.sf-stream-meta-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

/* Modals */
.sf-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(21, 24, 39, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.sf-modal-overlay.is-active {
  display: flex;
}

.sf-modal {
  background: var(--bg-surface);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  animation: sfModalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes sfModalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.sf-modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sf-modal-title {
  font-size: 1.25rem;
  font-weight: 700;
}

.sf-modal-close {
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-xs);
}

.sf-modal-close:hover {
  color: var(--text-primary);
  background: var(--bg-subtle);
}

.sf-modal-body {
  padding: 24px;
}

.sf-modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
}

/* Forms */
.sf-form-group {
  margin-bottom: 18px;
}

.sf-form-label {
  display: block;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.sf-form-input, .sf-form-textarea, .sf-form-select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  font-size: 0.92rem;
  color: var(--text-primary);
  transition: all var(--transition-fast);
}

.sf-form-input:focus, .sf-form-textarea:focus, .sf-form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(109, 93, 251, 0.15);
}

.sf-form-textarea {
  min-height: 80px;
  resize: vertical;
}

/* Toast Notifications */
.sf-toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 3000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.sf-toast {
  pointer-events: auto;
  background: #FFFFFF;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  animation: sfToastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  min-width: 280px;
  max-width: 400px;
}

@keyframes sfToastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.sf-toast-success {
  border-left: 4px solid var(--success);
}

.sf-toast-error {
  border-left: 4px solid var(--danger);
